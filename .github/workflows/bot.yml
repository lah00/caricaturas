name: Bot Automatizado - La Hiena

on:
  schedule:
    - cron: '0 13 * * *' # Se ejecuta automáticamente todos los días a la 1:00 PM UTC (puedes ajustarlo)
  workflow_dispatch: # Permite disparar la ejecución manualmente desde la pestaña "Actions" en GitHub

jobs:
  ejecutar-bot-ia:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script principal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
